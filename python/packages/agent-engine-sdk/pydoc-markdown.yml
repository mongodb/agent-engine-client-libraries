loaders:
  - type: python
    search_path: [.]
    modules:
      - agent_engine_sdk.app
      - agent_engine_sdk.interfaces
      - agent_engine_sdk.models

processors:
  - type: filter
    # Only document public members (no underscore prefix).
    skip_empty_modules: true
  - type: smart
  - type: crossref

renderer:
  type: markdown
  render_module_header: false
  descriptive_class_title: false
  render_toc: true
  toc_maxdepth: 3
