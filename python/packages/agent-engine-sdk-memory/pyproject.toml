[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling cannot infer the underscore import package from the hyphenated
# distribution name, so declare it explicitly.
[tool.hatch.build.targets.wheel]
only-include = ["agent_engine_sdk_memory", "README.md", "LICENSE"]

[project]
name = "agent-engine-sdk-memory"
version = "0.11.1"
description = "Slim public Memory facade and models for Atlas Agent Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1",
]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["agent_engine_sdk_memory"]
strict = ["agent_engine_sdk_memory"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
