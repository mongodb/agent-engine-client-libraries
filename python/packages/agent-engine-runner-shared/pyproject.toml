[project]
name = "agent-engine-runner-shared"
version = "0.11.6"
description = "Runner SDK - Framework-agnostic agent runtime"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    # FastAPI bundles starlette, but the package's own contract must pin a
    # floor: older starlette rebuilds url.path from the Host header with no
    # validation, which can disagree with scope["path"]. The
    # Host-validating _HOST_RE landed in starlette 1.4.1.
    "starlette>=1.4.1",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "protobuf>=6.33.6,<7",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "mcp==1.27.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "jsonschema>=4.26.0",
    "sentry-sdk>=2.27.0",
    # BaseAgent protocol and AgentInput/AgentEvent models
    "agent-engine-sdk==0.11.6",
    # Memory models and the MemoryClient HTTP client
    "agent-engine-sdk-memory==0.11.6",
    # Required for checkpoint message decoding (query/sessions endpoints)
    "msgpack>=1.0.0",
    # Required by guardrails_evaluator/regex.py for advanced regex matching
    "regex>=2026.4.4",
    # Advisory file locks for MCP OAuth cache read-modify-write
    "filelock>=3.0.0",
]

[project.optional-dependencies]
mongodb = [
    "pymongo>=4.0.0",
    "motor>=3.0.0",
]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.47b0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.390",
    "ruff>=0.6.0",
    "msgpack>=1.0.0",
    "pymongo>=4.0.0",
    "mongomock>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/agent_engine_runner_shared", "README.md", "LICENSE"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/agent_engine_runner_shared/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
agent-engine-sdk = { workspace = true }
agent-engine-sdk-memory = { workspace = true }
[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
