[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-engine-sdk-openai-agents"
version = "0.11.10"
description = "OpenAI Agents SDK adapter for Atlas Agent Engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "agent-engine-sdk-memory==0.11.10",
    "agent-engine-sdk==0.11.10",
    "agent-engine-runner-shared[mongodb,tracing]==0.11.10",
    # The application chooses the version. The floor is the oldest release the
    # test suite runs against (scripts/test.sh sdk-openai-agents).
    "openai-agents>=0.22.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/agent_engine_sdk_openai_agents", "README.md", "LICENSE"]
sources = ["src"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src"]
strict = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
agent-engine-sdk-memory = { workspace = true }
agent-engine-sdk = { workspace = true }
agent-engine-runner-shared = { workspace = true }
