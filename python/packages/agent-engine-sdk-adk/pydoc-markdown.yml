loaders:
  - type: python
    search_path: [src]
    modules:
      - agent_engine_sdk_adk.runtime
      - agent_engine_sdk_adk.agent
      - agent_engine_sdk_adk.runner
      - agent_engine_sdk_adk.rewind

processors:
  - type: filter
    # Only document public members (no underscore prefix).
    skip_empty_modules: true
  - type: smart
  - type: crossref

renderer:
  type: markdown
  render_module_header: false
  descriptive_class_title: false
  render_toc: true
  toc_maxdepth: 3
