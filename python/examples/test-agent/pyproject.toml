[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-agent"
version = "0.1.0"
description = "Test agent with controllable hooks for SDK integration testing"
requires-python = ">=3.11"
dependencies = [
    "agent-engine-sdk-langgraph",
    "langchain-anthropic>=1.7.2",
    "langchain-cerebras>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/test_agent"]

[tool.uv.sources]
agent-engine-sdk-langgraph = { workspace = true }
