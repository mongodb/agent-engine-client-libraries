[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mta-alerts-agent"
version = "0.1.0"
description = "MTA subway service alerts agent"
requires-python = ">=3.11"
dependencies = [
    "agent-engine-runner-shared[tracing]",
    "agent-engine-sdk-langgraph",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain-openai>=0.2",
    "langchain-anthropic>=1.7.2",
    "langchain-google-genai>=2.0",
    "langchain-cerebras>=0.3",
    "langgraph>=0.2",
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mta_alerts_agent"]

[tool.uv.sources]
agent-engine-runner-shared = { workspace = true }
agent-engine-sdk-langgraph = { workspace = true }
