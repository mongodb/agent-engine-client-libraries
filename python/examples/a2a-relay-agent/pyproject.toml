[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-relay-agent"
version = "0.1.0"
description = "Deterministic A2A relay fixture for the live-environment E2E suite"
requires-python = ">=3.11"
dependencies = [
    "agent-engine-runner-shared[tracing]",
    "agent-engine-sdk-langgraph>=0.11",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langgraph>=1.2.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_relay_agent"]

[tool.uv.sources]
agent-engine-runner-shared = { workspace = true }
agent-engine-sdk-langgraph = { workspace = true }
