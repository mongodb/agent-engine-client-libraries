[project]
name = "insurance-agent-runner"
version = "0.1.0"
description = "Insurance agent fixture used by CLI integration tests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb,tracing]",
    "agent-engine-sdk-langgraph",
    "python-dotenv>=1.2.3",
    "langchain-anthropic>=1.4.0",
    "langchain-cerebras>=0.8.2",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=0.2",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
]

[project.scripts]
insurance-agent = "insurance_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_agent"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.1.0",
]

[tool.uv.sources]
agent-engine-runner-shared = { workspace = true }
agent-engine-sdk-langgraph = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
