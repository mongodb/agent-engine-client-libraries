[tool.uv.workspace]
members = ["packages/*", "examples/*"]

[tool.ruff]
line-length = 88
src = ["packages/agent-engine-sdk-langgraph/src", "packages/agent-engine-sdk-adk/src", "packages/agent-engine-runner-shared/src", "examples/test-agent/src", "examples/insurance-agent/src", "examples/mta-alerts-agent/src"]
extend-exclude = ["packages/agent-engine-runner-shared/src/agent_engine_runner_shared/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]
